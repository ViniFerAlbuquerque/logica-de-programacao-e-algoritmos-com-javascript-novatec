<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Programa "Qual é a fruta?"</title>
</head>

<body>
    <div class="container">
        <section class="section-img">
            <img src="img/ex7_2.jpg" alt="Frutas">
        </section>
        <section class="form-section">
            <h1>Programa Qual é a Fruta?</h1>
            <form>
                <div class="form-group">
                    <label for="inLetra">Adivinhe a letra:</label>
                    <input type="text" id="inLetra" autofocus required placeholder="Digite uma letra...">
                </div>
                <input type="submit" value="Jogar">
            </form>
            <h3>Descubra: <span class="entre-letras" id="palavraMascaradaDisplay"></span></h3>
            <p>Tentativas Restantes: <span id="tentativasRestantesDisplay"></span></p>
            <p>Letras já tentadas: <span id="letrasTentadasDisplay">Nenhuma!</span></p>
            <p id="mensagem" class="game-message"></p>
            <button type="button" id="btnReiniciar" class="btn-reiniciar">Reiniciar Jogo!</button>
        </section>
    </div>

    <footer>
        <p>ViniFerAlbuquerque</p>
        <p>Todos os direitos reservados!</p>
    </footer>

    <script src="script.js"></script>
    
</body>

</html>
