<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Programa Caixa da Loja!</title>
</head>

<body>
    <main class="app-container">
        <section id="image-section" class="content-panel">
            <img src="img/caixa.jpg" alt="Caixa da loja!">
        </section>
        <section>
            <h1>Programa Caixa da loja:</h1>
            <hr>
            <form class="account-form">
                <fieldset>
                    <legend>Detalhes da Conta</legend>
                    <div class="form-group">
                        <label for="inDataVEnc">Data de vencimento:</label>
                        <input type="date" id="inDataVEnc" name="inDataVEnc" autofocus required>
                    </div>
                    <div class="form-group">
                        <label for="inValor">Valor da Conta R$:</label>
                        <input type="number" id="inValor" min="0" step="0.01" class="align-right" required readonly placeholder="0.00" >
                        <!-- <input type="submit" value="Calcular Multa e juros $"> -->
                        <button type="submit">Calcular Multa e Juros $</button>
                    </div>
                    <div class="form-group">
                        <label for="outValMulta">Valor da Multa R$:</label>
                        <input type="number" name="outMulta" id="outMulta" class="align-right" readonly placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="outJuros">Valor dos Juros R$:</label>
                        <input type="number" id="outJuros" class="align-right" readonly placeholder="0.00">
                        <!-- <input type="reset" value="Nova Conta"> -->
                        <button type="reset">Nova Conta</button>
                    </div>
                </fieldset>
            </form>

        </section>

    </main>

    <footer>
        <p>ViniFerAlbuquerque</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
