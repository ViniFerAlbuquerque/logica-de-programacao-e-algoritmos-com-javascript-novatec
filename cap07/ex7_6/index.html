<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Programa Valida Senha!</title>
</head>

<body>
    <main>
        <section>
            <img src="img/ex7_6.jpg" alt="Imagem do cadeado e senha!">
        </section>
        <section>
            <h1>Programa Valida Senha:</h1>
            <hr>

            <form>
                <div class="password-input-wrapper">
                    <label for="inSenha">Senha:</label>
                    <input type="password" id="inSenha" placeholder="Adicione sua senha..." autofocus required>
                    <!-- <button type="button" id="togglePasswordVisibility" class="toggle-password-button">Mostrar</button> -->
                    <button type="button" id="togglePasswordVisibility" class="toggle-password-button">
                        <i class="fas fa-eye-slash"></i>
                </div>
                <input type="submit" value="Verificar Validade!">
            </form>
            <h3 id="mensagemValidacao"></h3>
        </section>
    </main>
    <footer>
        <div class="footer-content">
            <p>ViniFerAlbuquerque</p>
            <p>Todos os direitos reservados!</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
