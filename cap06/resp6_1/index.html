<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../cap04/assets/livrojs.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Jogos Eliminatórios!</title>
</head>
<body>
    <section class="image-section">
        <img src="assets/exerc.jpg " alt="Exercícios!" class="exerc">
    </section>
    <section class="content-section">
        <h1>Jogos Eliminatórios:</h1>
        <hr>

            <div class="input-area">
                <label for="NomeDoClube">Clube:</label>
                <input type="text" id="nomeClube"  placeholder="Digite o nome do clube!">
                <input type="button" value="Adicionar!" id="btAdicionar">
            </div>


            <div class="button-area">
                <input type="button" value="Listar Clubes:" id="btListar">
                <input type="button" value="Tabela de Jogos:" id="btTabela">
            </div>
       
            <div class="club-list-container">
                <h2>Clubes participantes:</h2>
                <ul class="club-list" id="listaClubes">

                </ul>
            </div>

            <div class="match-table-container">
                <h2>Tabela de Jogos:
                    <ul class="match-list" id="tabelaJogos">

                    </ul>
                </h2>
            </div>

    </section>

    <script src="script.js"></script>
</body>

</html>
