<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../cap04/assets/livrojs.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Jogos Eliminatórios!</title>
</head>
<body>
    <section class="image-section">
        <img src="assets/exerc.jpg " alt="Exercícios!" class="exerc">
    </section>
    <section class="content-section">
        <h1>Jogos Eliminatórios:</h1>
        <hr>

            <div class="input-area">
                <label for="NomeDoClube">Clube:</label>
                <input type="text" id="nomeClube"  placeholder="Digite o nome do clube!">
                <input type="submit" value="Adicionar!">
            </div>


            <div class="button-area">
                <input type="button" value="Listar Clubes:" id="btListar">
                <input type="button" value="Tabela de Jogos:" id="btTabela">
            </div>
       
            <div class="club-list-container">
                <h2>Clubes participantes:</h2>
                <ul class="club-list">
                    <li>Clube A</li>
                    <li>Clube B</li>
                    <li>Clube C</li>
                    <li>Clube D</li>
                    <li>Clube E</li>
                    <li>Clube F</li>
                </ul>
            </div>
    </section>
</body>
</html>
